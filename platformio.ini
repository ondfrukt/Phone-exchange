; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = devkitc

[env]
platform = espressif32@^6.12.0
framework = arduino
upload_speed = 921600
lib_compat_mode = strict
lib_ldf_mode = chain+
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
monitor_speed = 115200
monitor_raw = yes
monitor_dtr = 0
monitor_rts = 0

lib_deps = 
	adafruit/Adafruit MCP23017 Arduino Library
	adafruit/Adafruit BusIO @ ^1.17.4
	ESP32Async/AsyncTCP @ ^3.4.7
	ESP32Async/ESPAsyncWebServer @ ^3.9.2
	majicdesigns/MD_AD9833@^1.3.0
	knolleary/PubSubClient @ ^2.8

[env:devkitc]
board = esp32-s3-devkitc-1
build_flags =
	-std=gnu++17
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MODE=1

[env:wroom]
board = esp32-s3-devkitc-1
build_flags =
	-std=gnu++17
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

; --- OTA upload environments -------------------------------------------
; Same firmware as above, but uploads over WiFi (both "Upload" and
; "Upload Filesystem Image") instead of over USB. Requires the device to
; already be on the network and reachable at phoneexchange.local; if mDNS
; resolution doesn't work on your network, replace upload_port with the
; device's IP address instead.
[env:devkitc_ota]
extends = env:devkitc
upload_protocol = espota
upload_port = phoneexchange.local

[env:wroom_ota]
extends = env:wroom
upload_protocol = espota
upload_port = phoneexchange.local

; --- Quick reference: OTA commands --------------------------------------
;   Firmware:   pio run -e devkitc_ota -t upload
;   Filesystem: pio run -e devkitc_ota -t uploadfs
; (swap devkitc_ota -> wroom_ota for the wroom board)
;
; Also available as VS Code tasks (Ctrl+Shift+P -> "Tasks: Run Task"):
;   "PlatformIO: OTA Upload Firmware"
;   "PlatformIO: OTA Upload Filesystem (UI)"
